<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>TRI-FRONT</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

	<style>
html{height:100%;background:#101714}body{height:100%;display:flex;align-items:center;justify-content:center;padding:64px 0 42px;box-sizing:border-box}
#canvas{width:min(100vw,calc((100dvh - 106px)*2.22222));height:auto;aspect-ratio:20/9;touch-action:none}
#labbar,#labfoot{position:fixed;left:0;right:0;z-index:5;background:#101714ee;color:#e5eadf;font:13px/1.3 system-ui;padding:6px max(10px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px;flex-wrap:wrap}#labbar{top:0;min-height:34px}#labfoot{bottom:0;min-height:28px}#labbar a,#labbar button{color:#eef8dd;background:#2e4438;border:1px solid #69806d;border-radius:7px;padding:6px 10px;font:inherit;text-decoration:none;min-height:32px}#labmetrics{flex:1}#laberror{color:#ffb2a8}#status-notice{max-width:90vw}
#labbar{gap:4px;padding:4px 10px}#labbar a,#labbar button{box-sizing:border-box;font-size:12px;padding:4px 8px;min-height:30px}#labmetrics{flex-basis:100%;font-size:12px}#labfoot{font-size:11px}
#status{background:radial-gradient(ellipse at 25% 20%,#3a3024,#101923 75%)}#status-splash{display:none}#status::before{content:'TRI-FRONT';position:absolute;top:38%;left:0;right:0;text-align:center;font:bold clamp(30px,7vw,64px) Georgia,serif;color:#e2c27a;text-shadow:0 3px 10px #000}#status-progress{accent-color:#d9b975}
</style>
<script>
window.__nativeActorState=null;
window.__nativeActorBuild=null;
window.__nativeActorLoading={started:performance.now(),files:{},expected:0,lastData:performance.now()};
window.nativeActorProgress=function(){
 if(window.__nativeActorStartup)return;
 const load=window.__nativeActorLoading;if(performance.now()-(load.lastRender||0)<200)return;load.lastRender=performance.now();const files=Object.values(load.files),received=files.reduce((n,f)=>n+f.received,0),seconds=(performance.now()-load.started)/1000;
 const progress=document.getElementById('status-progress');if(progress&&load.expected){progress.max=load.expected;progress.value=Math.min(received,load.expected)}
 const text=files.length?`게임 데이터 ${(received/1048576).toFixed(1)} / ${(load.expected/1048576).toFixed(1)} MiB · ${seconds.toFixed(0)}초`:`브라우저 준비 중 · ${seconds.toFixed(0)}초`;
 const metrics=document.getElementById('labmetrics');if(metrics)metrics.textContent=text;
 const foot=document.getElementById('labfoot');if(foot)foot.textContent=performance.now()-load.lastData>20000?'연결 또는 엔진 준비를 기다리고 있습니다. 화면을 열어둔 채 기다리거나 Chrome에서 직접 열어주세요.':'실제 수신량을 표시합니다. 데이터 수신 후 엔진을 준비하며, 다음 실행은 브라우저 캐시를 사용합니다.';
};
// Count the engine side module too: the stock progress callback omits that large file.
const nativeActorFetch=window.fetch.bind(window);
window.fetch=async function(input,init){
 const response=await nativeActorFetch(input,init),url=typeof input==='string'?input:input.url;
 if(!response.ok||!response.body||!/\.(wasm|pck)(\?|$)/.test(url)||typeof TransformStream==='undefined')return response;
 const name=new URL(url,location.href).pathname.split('/').pop(),load=window.__nativeActorLoading;
 const item=load.files[name]={received:0,done:false};
 const stream=response.body.pipeThrough(new TransformStream({transform(chunk,controller){item.received+=chunk.byteLength;load.lastData=performance.now();controller.enqueue(chunk)},flush(){item.done=true}}));
 const counted=new Response(stream,{status:response.status,statusText:response.statusText,headers:response.headers});
 Object.defineProperty(counted,'url',{value:response.url});return counted;
};
const nativeActorProgressTimer=setInterval(()=>window.nativeActorProgress(),500);
fetch('../build.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('빌드 정보 조회 실패');return r.json()}).then(b=>{const prefix=b.play_path||'play/';window.__nativeActorBuild={source_commit:b.source_commit,upstream_commit:b.upstream_commit,content_version:b.content_version,source_inventory_sha256:b.source_inventory_sha256,wasm_sha256:b.wasm_sha256,pck_sha256:b.files[prefix+(b.main_pack||'index.pck')].sha256,html_sha256:b.files[prefix+'index.html'].sha256};window.__nativeActorLoading.expected=Object.entries(b.files).filter(([n])=>n.startsWith(prefix)&&/\.(wasm|pck)$/.test(n)).reduce((n,[,f])=>n+f.bytes,0)}).catch(e=>{window.__nativeActorBuildError=String(e)});
window.nativeActorFailure=function(message){document.getElementById('laberror').textContent=message;window.__nativeActorFailure=message};
window.nativeActorReady=function(){window.__nativeActorStartup={ready_ms:performance.now()-window.__nativeActorLoading.started,files:window.__nativeActorLoading.files};clearInterval(nativeActorProgressTimer);document.getElementById('labfoot').textContent='화면 전환 후 5초 워밍업 · 가로 화면에서 플레이해주세요.'};
window.nativeActorReport=function(row){
 row.browser={userAgent:navigator.userAgent,width:innerWidth,height:innerHeight,dpr:devicePixelRatio,crossOriginIsolated:window.crossOriginIsolated,visibility:document.visibilityState};
 row.js_heap_bytes=performance.memory?.usedJSHeapSize??null;row.recorded_at=new Date().toISOString();
 row.build=window.__nativeActorBuild;
 window.__nativeActorState=row;
 const status=row.mode==='cpp'?`C++ ${row.unit_batches>0?'작동 중':'대기'} · 호출 ${row.unit_batches}/${row.pose_batches}/${row.sort_batches}/${row.shadow_batches??0} · 필드 ${row.field_queries??0}`:'GDScript 작동 중';
 document.getElementById('labmetrics').textContent=row.samples?`${status} | ${row.fps.toFixed(1)} FPS · 평균 ${row.mean_ms.toFixed(1)} / p99 ${row.p99_ms.toFixed(1)} ms · ${row.samples}프레임`:`${status} | 워밍업 ${Math.min(5,row.elapsed_s).toFixed(0)}/5초`;
 document.getElementById('labfoot').textContent=`${row.phase} · tick ${row.tick} · 스냅샷 ${row.snapshot_builds??0}/${row.snapshot_reuses??0} · 검색 준비 ${row.spatial_index_builds??0} · 객체 ${row.objects} · 텍스처 ${(row.texture_bytes/1048576).toFixed(1)} MiB · ${row.browser.crossOriginIsolated?'격리됨':'격리 안 됨'} · 브라우저가 제공하지 않는 메모리는 0/미지원으로 기록됩니다.`;
 if(row.samples>0&&row.build&&document.visibilityState==='visible')try{localStorage.setItem('trifront-cpp-release-'+row.build.source_inventory_sha256.slice(0,12)+'-'+row.build.html_sha256.slice(0,12)+'-'+row.mode+'-'+row.map+'-'+row.stress,JSON.stringify(row))}catch{}
};
document.addEventListener('DOMContentLoaded',()=>{
 const bar=document.createElement('div');bar.id='labbar';bar.innerHTML='<span>TRI-FRONT</span><button id="save">기록 저장</button><button id="full">전체 화면</button><span id="labmetrics">게임 불러오는 중…</span><span id="laberror" role="alert"></span>';document.body.append(bar);
 const foot=document.createElement('div');foot.id='labfoot';foot.textContent='최초 로딩 시 다운로드와 브라우저 격리 준비로 새로고침이 발생할 수 있습니다.';document.body.append(foot);
 document.getElementById('save').onclick=()=>{const rows=[];try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key.startsWith('trifront-cpp-release-'))rows.push(JSON.parse(localStorage.getItem(key)))}}catch{}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({scope:'cpp-web-release; live app flow; screen-local rolling frame metrics; not native APK performance',rows},null,2)],{type:'application/json'}));a.download='trifront-web-results.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
 document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.().catch(()=>{foot.textContent='이 브라우저는 전체 화면을 지원하지 않습니다. 가로 화면으로 실행해주세요.'});
 window.addEventListener('error',e=>window.nativeActorFailure(e.message));
 window.addEventListener('unhandledrejection',e=>window.nativeActorFailure(String(e.reason)));
});
</script>

</head>

		<canvas width="800" height="360" id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args": [], "canvasResizePolicy": 0, "emscriptenPoolSize": 8, "ensureCrossOriginIsolationHeaders": true, "executable": "index", "experimentalVK": false, "fileSizes": {"index.wasm": 1508095, "index-ce99230f1cca.pck": 37486124}, "focusCanvas": true, "gdextensionLibs": ["actor_batch-8604c771c39f.wasm"], "godotPoolSize": 4, "serviceWorker": "index.service.worker.js", "mainPack": "index-ce99230f1cca.pck"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});


    if (!window.crossOriginIsolated) {
        setStatusNotice('브라우저 격리를 준비하고 있습니다. 잠시 기다려주세요…');
        setStatusMode('notice');
        if (!('serviceWorker' in navigator)) {
            displayFailureNotice('이 브라우저에서는 C++ 웹 실행에 필요한 서비스 워커를 사용할 수 없습니다. Chrome 또는 Safari에서 직접 열어주세요.');
        } else {
            navigator.serviceWorker.register(GODOT_CONFIG.serviceWorker)
                .then(() => navigator.serviceWorker.ready)
                .then(() => window.location.reload())
                .catch(displayFailureNotice);
        }
        return;
    }
	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function () { window.nativeActorProgress?.(); },
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
